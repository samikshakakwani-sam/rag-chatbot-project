# Render blueprint — one-click deploy of FundFacts AI from this repo's Dockerfile.
# After connecting the repo in Render, set GROQ_API_KEY as a secret (sync:false).
services:
  - type: web
    name: fundfacts-ai
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: standard            # ≥2 GB RAM — required for PyTorch + BGE (free 512 MB OOMs)
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: GROQ_API_KEY     # set this in the Render dashboard (secret)
        sync: false
      - key: LLM_PROVIDER
        value: groq
      - key: RATE_LIMIT_MAX   # tighter limit for a public endpoint
        value: "15"
      - key: RATE_LIMIT_WINDOW
        value: "60"
